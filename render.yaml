services:
  - type: web
    name: kio-lol
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node --import tsx server/index.ts
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
