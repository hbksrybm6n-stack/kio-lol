services:
  - type: web
    name: kio-lol
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node --import tsx server/index.ts
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
